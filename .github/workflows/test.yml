name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Compile check
        run: python3 -m py_compile app/agent.py app/test_agent.py
      - name: Run tests
        run: python3 -m pytest app/test_agent.py -v
